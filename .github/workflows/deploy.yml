name: deploy-dev

on:
  workflow_run:
    workflows: ["build-image"]
    types:
      - completed

jobs:
    deploy-dev:
      needs: build-image
      runs-on: self-hosted
      environment: dev

      steps:

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install pip
        run: |
          python -m pip install --upgrade pip

      - name: Checkout
        uses: actions/checkout@v3

      - name: Modify values file - charts
        shell: bash
        run: |
          echo ${{needs.build-image.outputs.image_tag}}
          pip install yq
          yq -Yi '.image.tag = "${{needs.build-image.outputs.image_tag}}"' charts/python-app/values.yaml

      - name: Commit changes
        uses: EndBug/add-and-commit@v9
        with:
          message: 'Updates values.yaml with commit ${{needs.build-image.outputs.image_tag}}'

      - name: ArgoCD Install
        shell: bash
        run: |
          curl -sSL -o argocd-linux-amd64 https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          sudo install -m 555 argocd-linux-amd64 /usr/local/bin/argocd
          rm argocd-linux-amd64

      - name: ArgoCd app Sync
        shell: bash
        run: |
          argocd login --insecure \
          --grpc-web argocd-server.argocd \
          --username ${{ secrets.ARGOCD_USERNAME }} \
          --password ${{ secrets.ARGOCD_PASSWORD }}
          argocd app sync python-app
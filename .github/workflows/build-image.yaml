name: build-image

on:
  workflow_call:
    outputs:
      image_tag:
        description: Docker image tag built in this workflow
        value: ${{ jobs.build-image.outputs.build_tag }}
      
jobs:
  build-image:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Set tag
      id: tag
      run: echo "tag=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

    - name: Login DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build image for security scan
      uses: docker/build-push-action@v6
      with:
          load: true
          tags: rodriguecj/python-app:${{ steps.tag.outputs.tag }}

    - name: Scan image
      uses: aquasecurity/trivy-action@0.24.0
      with:
        image-ref: rodriguecj/python-app:${{ steps.tag.outputs.tag }}
        severity: CRITICAL,HIGH

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
          
    - name: Push image
      uses: docker/build-push-action@v6
      with:
        platforms: linux/amd64,linux/arm64
        push: true
        tags: rodriguecj/python-app:${{ steps.tag.outputs.tag }}
    
    outputs:
      build_tag: ${{ steps.tag.outputs.tag }}
